<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>학습자료 편집기</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;font:14px/1.4 system-ui,"Malgun Gothic",sans-serif;background:#1b1b1d;color:#eee}
#bar{display:flex;gap:6px;align-items:center;padding:8px 10px;background:#111;flex-wrap:wrap}
#bar b{margin-right:8px;color:#d8c3a5}
button{font:inherit;background:#2c2c30;color:#eee;border:1px solid #444;border-radius:6px;padding:5px 10px;cursor:pointer}
#bar select{font:inherit;background:#2c2c30;color:#eee;border:1px solid #444;border-radius:6px;padding:5px 8px}
button:hover{background:#3a3a40}
button.main{background:#d8c3a5;color:#111;border-color:#d8c3a5}
#fname{color:#999;margin-left:auto;font-size:12px}
main{flex:1;display:flex;min-height:0}
#stage{flex:1;overflow:auto;background:#444;display:flex;justify-content:center}
#wrap{position:relative;width:100%;height:100%;background:#fff}
#wrap.mobile{width:390px}
iframe{width:100%;height:100%;border:0;display:block;background:#fff}
#guides{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}
#guides div,#gaps div{position:absolute}
#gaps{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}
#multi{position:absolute;inset:0;pointer-events:none;z-index:4}
#multi div{position:absolute;border:2px solid #3aa0ff;opacity:.7}
.q4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.q4>div{min-width:0}
.q4 span{display:block;font-size:11px;color:#999;white-space:nowrap}
#panel{overflow-x:hidden}
#panel .q4 input{width:100%}
.tg.on{background:#d8c3a5;color:#111;border-color:#d8c3a5}
#panel h4{margin-top:14px}
#gaps .gp{pointer-events:auto;cursor:pointer}
#gaps .gp{transform:translate(-50%,-50%);background:#ff9f1a;color:#111;font:600 11px/1 system-ui;padding:2px 4px;border-radius:3px}
#box{position:absolute;display:none;border:2px solid #3aa0ff;pointer-events:none;z-index:5}
#hd{position:absolute;right:-7px;bottom:-7px;width:12px;height:12px;background:#3aa0ff;border:2px solid #fff;cursor:se-resize;pointer-events:auto}
#tree{width:210px;overflow:auto;background:#222226;border-right:1px solid #333;padding:8px 0;font-size:12px}
#tree h4{margin:0 10px 6px;font-size:13px;color:#d8c3a5}
#tree .tr{display:block;width:100%;text-align:left;border:0;border-radius:0;background:none;padding:3px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#ccc}
#tree .tr:hover{background:#2f2f35}
#tree .tr.on{background:#d8c3a5;color:#111}
#tree .tr.gone{opacity:.4;text-decoration:line-through}
#tree .tr i{font-style:normal;color:#8ab4ff;margin-right:4px}
#tree .tr.on i{color:#333}
#panel .ptabs{margin:0 0 10px}#panel .ptabs button{flex:1}
#panel .mcard{border:1px solid #444;border-radius:8px;padding:8px;margin:8px 0}
#panel{width:250px;overflow:auto;padding:12px;background:#222226;border-left:1px solid #333}
#panel h4{margin:0 0 8px;font-size:13px;color:#d8c3a5}
#panel label{display:flex;justify-content:space-between;align-items:center;margin:8px 0;gap:8px}
#panel select{width:140px;background:#111;color:#eee;border:1px solid #444;border-radius:4px;padding:3px}
#panel input[type=number]{width:80px;background:#111;color:#eee;border:1px solid #444;border-radius:4px;padding:3px}
#panel input[type=color]{width:50px;height:26px;padding:0;border:0;background:none}
#sel{font-size:11px;color:#999;word-break:break-all;margin-bottom:8px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.hint{color:#999;font-size:13px}
#tl{display:none;background:#222226;border-top:1px solid #333;padding:8px 12px}
#tl .row{align-items:center;margin:0 0 8px}
#tl select{font:inherit;background:#2c2c30;color:#eee;border:1px solid #444;border-radius:6px;padding:4px 6px}
#tlinfo{color:#999;font-size:12px}
#tlbar{position:relative;height:46px;margin:0 20px 18px;background:#1b1b1d;border-radius:6px;cursor:col-resize;touch-action:none}
#tlbar .tk{position:absolute;bottom:-16px;font-size:11px;color:#888;transform:translateX(-50%);pointer-events:none}
#tlbar .kd{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;padding:0;background:#d8c3a5;border:2px solid #111;border-radius:3px;transform:rotate(45deg);cursor:ew-resize}
#tlbar .kd.on{background:#3aa0ff;border-color:#fff}
#ph{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:#ff3ea5;display:none;pointer-events:none}
#hov{position:absolute;display:none;border:2px dashed #ff3ea5;background:rgba(255,62,165,.12);pointer-events:none;z-index:5}
#tree .sl{display:flex;align-items:center;gap:6px;padding:0 10px 6px}
#tree .sl b{flex:1;text-align:center}
#tree .sl button{padding:3px 10px}
#tree .sg{display:flex;flex-wrap:wrap;gap:3px;padding:0 10px 8px}
#tree .sg button{min-width:28px;padding:3px 0;font-size:12px}
#tree .sg button.on{background:#d8c3a5;color:#111;border-color:#d8c3a5}
#tree .hn{color:#888;margin-left:6px}
#tree .tr.on .hn{color:#444}
#tree .tr.sld{font-weight:600;color:#d8c3a5}
#tree .tr.sld.on{color:#111}
#panel .mh{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:4px}
#panel label.sl{display:block}
#panel label.sl span{display:flex;justify-content:space-between}
#panel label.sl input{width:100%}
#panel .seg{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin:8px 0}
#panel .seg span{margin-right:4px}
#panel .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
#panel .pcard{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;line-height:1.25;text-align:center}
#panel .pcard .pv{display:inline-block;padding:2px 10px;background:#d8c3a5;color:#111;border-radius:6px;font-weight:700}
#panel .pcard:hover .pv,#panel .pcard:focus-visible .pv{animation:var(--n) var(--du) var(--ea) infinite}
@media (prefers-reduced-motion:reduce){#panel .pcard:hover .pv,#panel .pcard:focus-visible .pv{animation:none}}
#panel .chk{display:flex;gap:6px;align-items:center;justify-content:flex-start;margin:8px 0}
#panel details{margin:8px 0}
#panel summary{cursor:pointer;color:#d8c3a5;padding:4px 0}
#panel .mguide{margin:0 0 8px}
#toast{position:fixed;left:50%;bottom:46px;transform:translateX(-50%);background:#d8c3a5;color:#111;padding:8px 14px;border-radius:8px;display:none;z-index:9}
footer{padding:4px 10px;font-size:11px;color:#777;text-align:center;background:#111;word-break:keep-all}
</style>
</head>
<body>
<header id="bar">
  <b>학습자료 편집기</b>
  <button class="main" id="bOpen">HTML 열기</button>
  <button id="bUndo">되돌리기 (Ctrl+Z)</button>
  <button id="bCopy">변경목록 복사</button>
  <button id="bSave">파일에 저장</button>
  <button id="bDown">새 파일로 받기</button>
  <select id="bAdd"><option value="">＋ 요소 추가…</option><option value="text">글자</option><option value="btn">버튼</option><option value="box">상자</option><option value="img">이미지</option></select>
  <button id="bSnap">🧲 자석·가이드선 켜짐</button>
  <button id="bPause">⏸ 모션 멈춤 꺼짐</button>
  <button id="bLive">👆 작동 모드 꺼짐</button>
  <button id="bMob">📱 모바일 화면</button>
  <span id="fname">파일을 열어 주세요</span>
</header>
<main>
  <aside id="tree"></aside>
  <div id="stage"><div id="wrap"><iframe id="f"></iframe><div id="gaps"></div><div id="guides"></div><div id="multi"></div><div id="hov"></div><div id="box"><i id="hd"></i></div></div></div>
  <aside id="panel"></aside>
</main>
<div id="tl"></div>
<footer>학습자료 편집기 © 2026 KIMYERANG. 본 앱은 자유롭게 사용할 수 있으나, 저작자의 허락 없는<br>복제·배포·수정은 금지합니다. · v1.7 (2026-11-01)</footer>
<div id="toast"></div>
<input type="file" id="fileIn" accept=".html,.htm" hidden>
<input type="file" id="imgIn" accept="image/*" hidden>
<input type="file" id="newImgIn" accept="image/*" hidden>

<script>
const $ = id => document.getElementById(id);
const f = $('f'), box = $('box'), panel = $('panel');

let src = '', fname = '', handle = null, lastMod = 0, backedUp = false;
let doc = null, cur = null, editing = null, g = null, pend = false;
const orig = new Map();   // 선택자 -> 원본(style, html, src)
let ch = {};              // 선택자 -> {tx, ty, css:{}, html, src}
let undo = [];
let group = [];           // Shift+클릭으로 여러 개 고른 요소 (cur 포함, 2개 이상일 때만 사용)
const G = () => group.length > 1 ? group : cur ? [cur] : [];
let slides = [], slideCls = '';  // 슬라이드 모음(한 번에 하나만 보이는 형제들)과 "지금 보이는 것"을 표시하는 클래스
let kf = {}, kName = '', kSel = 0, phPct = null, kdrag = null;  // 키프레임 수정본 / 선택한 애니메이션 이름 / 선택한 키프레임 / 재생헤드(%) / 끌기 상태
let ptab = 'style', mpause = false, advOpen = false, seqOn = true;  // 패널 탭 / 모션 멈춤 / 고급(타임라인) 펼침 / 여러 개 차례대로  // 오른쪽 패널 탭 / 편집 중 모션 멈춤
let adds = [];            // 새로 넣은 요소 {parent 선택자, html, el}. 삭제는 요소를 지우지 않고 숨겨 두었다가(경로가 안 밀리게) 저장할 때 제거한다

function toast(t) {
  const el = $('toast'); el.textContent = t; el.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = 'none', 2600);
}

// ── 선택자: id가 유일하면 #id, 아니면 body부터 nth-child 경로
function pathOf(el) {
  if (el.id && doc.querySelectorAll('#' + CSS.escape(el.id)).length === 1) return '#' + CSS.escape(el.id);
  const p = [];
  for (; el && el !== doc.body; el = el.parentElement)
    p.unshift(el.tagName.toLowerCase() + ':nth-child(' + ([...el.parentElement.children].indexOf(el) + 1) + ')');
  return 'body > ' + p.join(' > ');
}

// ── 변경 기록: 원본을 보관해 두고 항상 "원본 + 변경"으로 다시 그린다 (되돌리기가 단순해짐)
function ent(s, el) {
  if (!orig.has(s)) orig.set(s, {
    style: (el.getAttribute('style') || '').replace(/;?\s*$/, ';').replace(/^;$/, ''),
    html: el.innerHTML, src: el.getAttribute('src')
  });
  return ch[s] ??= { tx: 0, ty: 0, css: {} };
}
const cssText = e => {
  let t = (e.tx || e.ty) ? `transform:translate(${e.tx}px,${e.ty}px);` : '';
  for (const k in e.css) t += `${k}:${e.css[k]};`;
  return t;
};
function render(s) {
  const el = doc.querySelector(s), o = orig.get(s), e = ch[s];
  if (!el || !o) return;
  const t = o.style + (e ? cssText(e) : '');
  t ? el.setAttribute('style', t) : el.removeAttribute('style');
  const h = e && e.html != null ? e.html : o.html;
  if (el.innerHTML !== h) el.innerHTML = h;
  if (e && e.gf) addFontLink(doc, e.gf);
  const sc = e && e.src != null ? e.src : o.src;
  sc == null ? el.removeAttribute('src') : el.setAttribute('src', sc);
}
// 글꼴: 구글 폰트 링크를 문서에 넣어야 저장한 파일을 다른 컴퓨터에서 열어도 같은 글꼴로 보인다
// 전부 상업적 이용·재배포가 허용되는 오픈 라이선스(SIL OFL / Apache 2.0) 글꼴만 넣는다
const GF = (label, name, kind) => [label, `'${name}',${kind}`, `https://fonts.googleapis.com/css2?family=${name.replace(/ /g, '+')}&display=swap`];
const FONTS = [['원래 글꼴', '', ''],
  ['[고딕] Pretendard', "'Pretendard',sans-serif", 'https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css'],
  GF('[고딕] Noto Sans KR', 'Noto Sans KR', 'sans-serif'), GF('[고딕] IBM Plex Sans KR', 'IBM Plex Sans KR', 'sans-serif'),
  GF('[고딕] Gothic A1', 'Gothic A1', 'sans-serif'), GF('[고딕] 나눔고딕', 'Nanum Gothic', 'sans-serif'),
  GF('[고딕] 고운돋움', 'Gowun Dodum', 'sans-serif'), GF('[고딕] 해바라기', 'Sunflower', 'sans-serif'),
  GF('[명조] Noto Serif KR', 'Noto Serif KR', 'serif'), GF('[명조] 나눔명조', 'Nanum Myeongjo', 'serif'),
  GF('[명조] 고운바탕', 'Gowun Batang', 'serif'), GF('[명조] 함렛', 'Hahmlet', 'serif'),
  GF('[제목] 검은고딕', 'Black Han Sans', 'sans-serif'), GF('[제목] 도현', 'Do Hyeon', 'sans-serif'),
  GF('[제목] 주아', 'Jua', 'sans-serif'), GF('[제목] 구기', 'Gugi', 'sans-serif'),
  GF('[제목] 베이글팻원', 'Bagel Fat One', 'sans-serif'), GF('[제목] 동글', 'Dongle', 'sans-serif'),
  GF('[손글씨] 개구', 'Gaegu', 'cursive'), GF('[손글씨] 나눔펜', 'Nanum Pen Script', 'cursive'),
  GF('[손글씨] 감자꽃', 'Gamja Flower', 'cursive'), GF('[손글씨] 하이멜로디', 'Hi Melody', 'cursive'),
  GF('[손글씨] 싱글데이', 'Single Day', 'cursive'), GF('[손글씨] 동해독도', 'East Sea Dokdo', 'cursive'),
  GF('[손글씨] 푸어스토리', 'Poor Story', 'cursive'), GF('[손글씨] 연성', 'Yeon Sung', 'cursive'),
  GF('[손글씨] 귀여운폰트', 'Cute Font', 'cursive')];
function addFontLink(d, h) {
  if ([...d.head.querySelectorAll('link')].some(l => l.getAttribute('href') === h)) return;
  const l = d.createElement('link'); l.rel = 'stylesheet'; l.href = h; d.head.appendChild(l);
}
// 되돌리기 기록: 변경 직전 상태를 저장 (여러 요소를 한 번에 바꿀 땐 하나로 묶어서 한 번에 되돌린다)
const snap = s => undo.push({ s, prev: ch[s] ? JSON.stringify(ch[s]) : null });
const snapG = els => undo.push({ batch: els.map(el => { const s = pathOf(el); return { s, prev: ch[s] ? JSON.stringify(ch[s]) : null }; }) });
function restore(x) { x.prev ? ch[x.s] = JSON.parse(x.prev) : delete ch[x.s]; render(x.s); }
function doUndo() {
  if (editing) return;
  const u = undo.pop(); if (!u) return toast('되돌릴 게 없어요');
  if (u.add) {  // 추가한 요소 취소
    const p = pathOf(u.add.el);
    orig.delete(p); delete ch[p];
    if (cur === u.add.el) cur = null;
    u.add.el.remove(); adds.splice(adds.indexOf(u.add), 1);
    upd(); fill(); return;
  }
  if (u.multi) { undo.push(...u.multi); u.multi.forEach(() => doUndo()); return; }
  if (u.kf) { u.prev ? kf[u.kf] = JSON.parse(u.prev) : delete kf[u.kf]; applyKf(); upd(); fill(); return; }
  u.batch ? [...u.batch].reverse().forEach(restore) : restore(u);
  upd(); fill();
}
function ensureBlock(e, el) {
  if (getComputedStyle(el).display === 'inline') e.css.display = 'inline-block';
}

// ── 선택 상자
function upd() {
  group = group.filter(x => x.isConnected); if (group.length < 2) group = [];
  const M = $('multi'); M.innerHTML = '';
  for (const el of group) {
    if (el === cur) continue;
    const r = el.getBoundingClientRect(), d = document.createElement('div');
    d.style.cssText = `left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px`; M.appendChild(d);
  }
  if (!cur || !cur.isConnected) { box.style.display = 'none'; showGaps(); return; }
  showGaps();
  const r = cur.getBoundingClientRect();
  Object.assign(box.style, { display: 'block', left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
}
// ── 슬라이드: 한 번에 하나만 보이는 같은 종류의 형제 요소들(예: section.slide)을 찾아 넘겨 가며 편집한다
//    넘기기는 앱이 쓰는 "지금 보이는 것" 클래스(예: active)를 옮기고, 앱에 같은 일을 하는 show() 함수가 있으면 그것도 부른다
function detectSlides() {
  slides = []; slideCls = '';
  if (!doc || !doc.body) return;
  const vis = c => doc.defaultView.getComputedStyle(c).display !== 'none';
  let best = null;
  for (const p of [doc.body, ...doc.body.querySelectorAll('*')]) {
    const groups = {};  // 같은 태그끼리 묶어 본다 (슬라이드 곁에 진행 막대·캔버스 같은 다른 태그가 있어도 되게)
    for (const c of p.children) if (!SKIP.test(c.tagName)) (groups[c.tagName] ??= []).push(c);
    for (const k of Object.values(groups)) {
      if (k.length < 3 || k.length > 300) continue;
      const common = [...k[0].classList].filter(c => k.every(x => x.classList.contains(c)));
      const shown = k.filter(vis);
      if (!common.length || shown.length > 1 || (best && best.k.length >= k.length)) continue;
      const act = shown[0] && [...shown[0].classList].find(c => !common.includes(c) && k.filter(x => x.classList.contains(c)).length === 1);
      if (act) best = { k, act };
    }
  }
  if (best) { slides = best.k; slideCls = best.act; }
}
const curSlide = () => Math.max(0, slides.findIndex(s => s.classList.contains(slideCls)));
function slideTitle(sl) {
  const h = sl.querySelector('h1,h2,h3,.title'), t = ((h || sl).textContent || '').trim().replace(/\s+/g, ' ');
  return t.slice(0, 16) || '(빈 슬라이드)';
}
function showSlide(i) {
  if (!slides.length) return;
  i = Math.max(0, Math.min(slides.length - 1, i));
  editing && editing.blur(); select(null);
  const win = f.contentWindow;
  if (typeof win.show === 'function' && String(win.show).includes(slideCls)) { try { win.show(i); } catch { } }  // 앱의 번호·진행 막대 등도 같이 바뀌게
  if (!slides[i].classList.contains(slideCls)) slides.forEach((s, k) => s.classList.toggle(slideCls, k === i));
  if (mpause) setTimeout(freezeMotion, 1200);
  upd(); fill();
}
function hover(el) {
  const H = $('hov'), r = el && el.isConnected ? el.getBoundingClientRect() : null;
  if (!r || r.width < 1 || r.height < 1) { H.style.display = 'none'; return; }
  Object.assign(H.style, { display: 'block', left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
}
// ── 왼쪽 구조 트리: 슬라이드 번호로 넘기고, 지금 슬라이드 안의 요소만 펼쳐 보여 준다
const SKIP = /^(SCRIPT|STYLE|LINK|META|NOSCRIPT|TEMPLATE|HEAD)$/, MAXT = 1500;
function renderTree() {
  const T = $('tree'), top = T.scrollTop; T.innerHTML = '';
  if (!doc || !doc.body) { T.innerHTML = '<h4>구조</h4>'; return; }

};

// ── 변경목록 복사 (Claude에게 붙여넣을 짧은 요약)
const NAMES = { 'margin-top': '바깥여백 위', 'margin-right': '바깥여백 오른쪽', 'margin-bottom': '바깥여백 아래', 'margin-left': '바깥여백 왼쪽',
  'padding-top': '안쪽여백 위', 'padding-right': '안쪽여백 오른쪽', 'padding-bottom': '안쪽여백 아래', 'padding-left': '안쪽여백 왼쪽',
  'font-weight': '글자굵기', 'font-style': '기울임', 'text-decoration': '밑줄', 'text-align': '정렬', 'line-height': '줄간격(배)', 'letter-spacing': '자간', gap: '칸 사이 간격',
  'font-family': '글꼴(구글 폰트 링크 필요)', color: '글자색', 'background-color': '배경색', 'font-size': '글자크기', 'border-radius': '둥글기', opacity: '투명도', 'animation-name': '애니메이션 이름', 'animation-duration': '애니메이션 시간', 'animation-delay': '애니메이션 지연', 'animation-iteration-count': '애니메이션 반복', 'animation-direction': '애니메이션 방향', 'animation-timing-function': '애니메이션 이징(곡선)', 'animation-fill-mode': '애니메이션 끝난 뒤', 'transition-duration': '전환 시간', 'transition-delay': '전환 지연', 'transition-timing-function': '전환 이징(곡선)', width: '너비', height: '높이', display: '표시' };
const sgn = n => (n > 0 ? '+' : '') + n;
function listText() {
  const lines = adds.map(a => `- [추가] ${a.parent} 안의 맨 끝에 새 요소 추가: ${a.html.slice(0, 120)}${a.html.length > 120 ? '…' : ''}`);
  for (const s in ch) {
    const e = ch[s], el = doc.querySelector(s), p = [];
    if (e.del) { lines.push(`- ${s} → 삭제(요소를 파일에서 제거)`); continue; }
    if (e.tx || e.ty) p.push(`위치 이동(가로 ${sgn(e.tx)}px, 세로 ${sgn(e.ty)}px, transform 기준)`);
    for (const k in e.css) if (k !== 'box-sizing') p.push(`${NAMES[k] || k}: ${e.css[k]}`);
    if (e.html != null) { const d = document.createElement('div'); d.innerHTML = e.html; p.push(`글자를 "${d.textContent.trim().slice(0, 80)}"(으)로 변경`); }
    if (e.src != null) p.push('이미지 교체(저장 파일에서만 반영)');
    if (!p.length) continue;
    const txt = el ? el.textContent.trim().slice(0, 15) : '';
    lines.push(`- ${s}${el ? ` <${el.tagName.toLowerCase()}${txt ? ' "' + txt + '"' : ''}>` : ''} → ${p.join(', ')}`);
  }
  for (const n in kf) lines.push(`- [키프레임] @keyframes ${n} 을 다음으로 교체: ${kfCss(n).replace(/\s+/g, ' ')}`);
  return lines.length ? `학습자료 편집기로 바꾼 내용입니다${fname ? ` (파일: ${fname})` : ''}. 아래 요소(CSS 선택자)에 반영해 주세요:\n` + lines.join('\n') : '';
}
$('bCopy').onclick = async () => {
  const t = src && listText();
  if (!t) return toast('복사할 변경이 없어요');
  try { await navigator.clipboard.writeText(t); toast('변경목록을 복사했어요. Claude에 붙여넣으세요'); }
  catch { prompt('복사해서 쓰세요', t); }
};
$('bUndo').onclick = doUndo;
$('bSnap').onclick = () => { snapOn = !snapOn; $('bSnap').textContent = '🧲 자석·가이드선 ' + (snapOn ? '켜짐' : '꺼짐'); toast(snapOn ? '끌 때 다른 요소에 달라붙어요 (Alt를 누르면 잠시 끔)' : '자석을 껐어요'); };
$('bLive').onclick = () => {
  live = !live; $('bLive').textContent = '👆 작동 모드 ' + (live ? '켜짐' : '꺼짐'); $('bLive').classList.toggle('main', live);
  const st = doc && doc.getElementById('hs-hover'); if (st) st.disabled = live;
  if (live) { editing && editing.blur(); select(null); toast('작동 모드: 앱을 평소처럼 눌러서 다른 화면으로 가 보세요. 끄면 다시 편집할 수 있어요'); }
  else { upd(); toast('편집 모드로 돌아왔어요'); }
};
$('bMob').onclick = () => { $('wrap').classList.toggle('mobile'); setTimeout(upd, 50); };
fill();
</script>
</body>
